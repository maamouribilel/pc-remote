<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PC Remote Ad</title>
<style>
  html, body { margin: 0; background: #0b0f14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// PC Remote — 28-second promo. Every frame is a pure function of time: renderAt(t).
// Cue times come from timeline.json (injected as window.TL by capture.mjs) so the
// soundtrack generator lands its effects on the same moments.

// 16:9 by default; 9:16 when the timeline asks for a portrait frame (or ?vertical in a live preview).
const VERT = !!(window.TL && window.TL.height > window.TL.width) || new URLSearchParams(location.search).has('vertical');
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const CX = W / 2;
const mainCv = document.getElementById('c');
mainCv.width = W; mainCv.height = H;
const mainCtx = mainCv.getContext('2d');
const devCv = document.createElement('canvas'); devCv.width = W; devCv.height = H;
const devCtx = devCv.getContext('2d');
let ctx = mainCtx;
let TL = window.TL;

const C = {
  bg: '#0b0f14', surface: '#171d25', surface2: '#1e2630', border: '#343e4a', borderHi: '#3d4753',
  accent: '#5ee8be', accentDim: '#2f7a65', muted: '#8a95a5', soft: '#aab4c0', text: '#f4f6f8',
  held: '#f3c779', danger: '#f2a7a0', screen: '#06090d',
};
const FONT = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
// 0 → 1 → 0 window: fades in over [a, a+fi], out over [b-fo, b]
const win = (t, a, b, fi = 0.25, fo = 0.25) => P(t, a, a + fi) * (1 - P(t, b - fo, b));
function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }
function rgba(h, a) { const A = hex(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }
const lerpRect = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) });
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function catmull(pts, s) {
  const n = pts.length - 1, f = clamp(s) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
  const u2 = u * u, u3 = u2 * u;
  const k = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
  return [k(p0[0], p1[0], p2[0], p3[0]), k(p0[1], p1[1], p2[1], p3[1])];
}
const quad = (p0, c, p1, s) => { const u = 1 - s; return [u * u * p0[0] + 2 * u * s * c[0] + s * s * p1[0], u * u * p0[1] + 2 * u * s * c[1] + s * s * p1[1]]; };

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function font(size, weight = 400) { return `${weight} ${size}px ${FONT}`; }
function txt(s, x, y, size, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = font(size, o.w ?? 400);
  ctx.fillStyle = o.color ?? C.text;
  ctx.textAlign = o.align ?? 'left';
  ctx.textBaseline = o.base ?? 'alphabetic';
  ctx.letterSpacing = (o.ls ?? 0) + 'px';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, w = 400, ls = 0) { ctx.save(); ctx.font = font(size, w); ctx.letterSpacing = ls + 'px'; const m = ctx.measureText(s).width; ctx.restore(); return m; }
// Words that rise in one after another. segs: [[text, color], ...]
function richRise(segs, cx, y, size, weight, t0, t, o = {}) {
  const words = [];
  for (const [s, col] of segs) for (const w of s.split(' ')) if (w) words.push([w, col]);
  const sp = measure(' ', size, weight);
  const widths = words.map(([w]) => measure(w, size, weight));
  const total = widths.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let x = (o.align === 'left') ? cx : cx - total / 2;
  const out = o.out ?? 1;
  words.forEach(([w, col], i) => {
    const p = E.outCubic(P(t, t0 + i * (o.stagger ?? 0.055), t0 + i * (o.stagger ?? 0.055) + 0.45));
    txt(w, x, y + (1 - p) * size * 0.55, size, { w: weight, color: col, alpha: p * out });
    x += widths[i] + sp;
  });
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }

// Line icons in a 24-unit box centred on (cx, cy), drawn at size s.
function icon(name, cx, cy, s, color, lw = 2) {
  ctx.save();
  ctx.translate(cx - s / 2, cy - s / 2); ctx.scale(s / 24, s / 24);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const L = (pts, close) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (close) ctx.closePath(); };
  switch (name) {
    case 'mouse': rr(6.5, 2.5, 11, 19, 5.5); ctx.stroke(); L([[12, 3], [12, 9]]); ctx.stroke(); break;
    case 'keyboard':
      rr(2, 5.5, 20, 13, 2.5); ctx.stroke();
      for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) { ctx.beginPath(); ctx.arc(5.5 + c * 3.25, 9.3 + r * 3, 0.9, 0, 7); ctx.fill(); }
      L([[8, 15.4], [16, 15.4]]); ctx.stroke(); break;
    case 'nav':
      for (const [x, y] of [[12, 5], [5, 12], [19, 12], [12, 19]]) { L([[x, y - 3.2], [x + 3.2, y], [x, y + 3.2], [x - 3.2, y]], true); ctx.stroke(); }
      break;
    case 'media': circle(12, 12, 9.5); ctx.stroke(); L([[10, 8], [16, 12], [10, 16]], true); ctx.stroke(); break;
    case 'pc': rr(2.5, 3.5, 19, 13, 2); ctx.stroke(); L([[12, 16.5], [12, 20.5]]); ctx.stroke(); L([[7.5, 20.5], [16.5, 20.5]]); ctx.stroke(); break;
    case 'gear': {
      circle(12, 12, 3.2); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = (i % 2) ? 7.2 : 9.6; const a2 = a + Math.PI / 16; ctx.lineTo(12 + Math.cos(a) * r, 12 + Math.sin(a) * r); ctx.lineTo(12 + Math.cos(a2) * r, 12 + Math.sin(a2) * r); }
      ctx.closePath(); ctx.stroke(); break;
    }
    case 'playpause': L([[3, 5], [12, 12], [3, 19]], true); ctx.fill(); ctx.fillRect(14, 5, 2.8, 14); ctx.fillRect(19, 5, 2.8, 14); break;
    case 'play': L([[7, 4.5], [19, 12], [7, 19.5]], true); ctx.fill(); break;
    case 'pause': ctx.fillRect(6, 5, 4, 14); ctx.fillRect(14, 5, 4, 14); break;
    case 'minus': L([[5, 12], [19, 12]]); ctx.stroke(); break;
    case 'plus': L([[5, 12], [19, 12]]); ctx.stroke(); L([[12, 5], [12, 19]]); ctx.stroke(); break;
    case 'speaker':
      L([[3, 9.5], [7, 9.5], [12, 5], [12, 19], [7, 14.5], [3, 14.5]], true); ctx.stroke();
      ctx.beginPath(); ctx.arc(13, 12, 4, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(13, 12, 7.5, -0.9, 0.9); ctx.stroke(); break;
    case 'speakerMinus': L([[2, 9.5], [6, 9.5], [11, 5], [11, 19], [6, 14.5], [2, 14.5]], true); ctx.stroke(); L([[15, 12], [21, 12]]); ctx.stroke(); break;
    case 'speakerPlus': L([[2, 9.5], [6, 9.5], [11, 5], [11, 19], [6, 14.5], [2, 14.5]], true); ctx.stroke(); L([[15, 12], [21, 12]]); ctx.stroke(); L([[18, 9], [18, 15]]); ctx.stroke(); break;
    case 'mute': L([[2, 9.5], [6, 9.5], [11, 5], [11, 19], [6, 14.5], [2, 14.5]], true); ctx.stroke(); L([[15, 9], [21, 15]]); ctx.stroke(); L([[21, 9], [15, 15]]); ctx.stroke(); break;
    case 'rewind': L([[11.5, 6], [3, 12], [11.5, 18]], true); ctx.fill(); L([[21, 6], [12.5, 12], [21, 18]], true); ctx.fill(); break;
    case 'forward': L([[3, 6], [11.5, 12], [3, 18]], true); ctx.fill(); L([[12.5, 6], [21, 12], [12.5, 18]], true); ctx.fill(); break;
    case 'lockOpen': rr(5, 11, 14, 10, 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(8, 11); ctx.lineTo(8, 7.5); ctx.arc(12, 7.5, 4, Math.PI, 0); ctx.stroke(); break;
    case 'lock': rr(5, 11, 14, 10, 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(8, 11); ctx.lineTo(8, 7.5); ctx.arc(12, 7.5, 4, Math.PI, 0); ctx.lineTo(16, 11); ctx.stroke(); break;
    case 'send': L([[21, 3], [3, 10.5], [10.5, 13.5], [13.5, 21]], true); ctx.stroke(); L([[21, 3], [10.5, 13.5]]); ctx.stroke(); break;
    case 'enter': L([[19, 5], [19, 13], [5, 13]]); ctx.stroke(); L([[9, 9], [5, 13], [9, 17]]); ctx.stroke(); break;
    case 'backspace': L([[8, 5], [21, 5], [21, 19], [8, 19], [2.5, 12]], true); ctx.stroke(); L([[11, 9], [17, 15]]); ctx.stroke(); L([[17, 9], [11, 15]]); ctx.stroke(); break;
    case 'tab': L([[4, 8], [19, 8]]); ctx.stroke(); L([[15, 4.5], [19, 8], [15, 11.5]]); ctx.stroke(); L([[20, 16], [5, 16]]); ctx.stroke(); L([[9, 12.5], [5, 16], [9, 19.5]]); ctx.stroke(); break;
    case 'shift': L([[12, 4], [12, 20]]); ctx.stroke(); L([[6, 10], [12, 4], [18, 10]]); ctx.stroke(); break;
    case 'search': circle(10.5, 10.5, 6.5); ctx.stroke(); L([[15.5, 15.5], [21, 21]]); ctx.stroke(); break;
    case 'check': L([[4.5, 12.5], [10, 18], [19.5, 6.5]]); ctx.stroke(); break;
    case 'phone': rr(6.5, 2, 11, 20, 2.6); ctx.stroke(); L([[10.5, 18.5], [13.5, 18.5]]); ctx.stroke(); break;
    case 'air':
      rr(8.5, 3, 7, 18, 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(12, 12, 8.3, Math.PI * 0.78, Math.PI * 1.22); ctx.stroke();
      ctx.beginPath(); ctx.arc(12, 12, 8.3, -Math.PI * 0.22, Math.PI * 0.22); ctx.stroke(); break;
    case 'sliders':
      L([[3, 8], [21, 8]]); ctx.stroke(); L([[3, 16], [21, 16]]); ctx.stroke();
      ctx.fillStyle = '#1e2630'; circle(15, 8, 2.6); ctx.fill(); ctx.stroke(); circle(9, 16, 2.6); ctx.fill(); ctx.stroke(); break;
    case 'fullscreen': for (const [x, y, dx, dy] of [[3, 3, 1, 1], [21, 3, -1, 1], [3, 21, 1, -1], [21, 21, -1, -1]]) { L([[x, y + 6 * dy], [x, y], [x + 6 * dx, y]]); ctx.stroke(); } break;
    case 'home': L([[3, 11], [12, 3.5], [21, 11]]); ctx.stroke(); L([[5.5, 9.5], [5.5, 20.5], [18.5, 20.5], [18.5, 9.5]]); ctx.stroke();
      ctx.beginPath(); ctx.arc(12, 17.5, 4.2, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); circle(12, 17.6, 0.9); ctx.fill(); break;
    case 'shield': L([[12, 2.5], [20, 5.5], [20, 11.5], [12, 21.5], [4, 11.5], [4, 5.5]], true); ctx.stroke(); L([[8.3, 11.8], [11, 14.5], [15.8, 8.8]]); ctx.stroke(); break;
    case 'cloudOff':
      ctx.beginPath(); ctx.moveTo(7, 18.5); ctx.arc(7, 14.5, 4, Math.PI / 2, Math.PI * 1.45); ctx.arc(12.5, 10, 5.5, Math.PI * 1.1, Math.PI * 1.95); ctx.arc(17.5, 14.5, 4, Math.PI * 1.55, Math.PI / 2); ctx.closePath(); ctx.stroke();
      L([[3, 3], [21, 21]]); ctx.stroke(); break;
    case 'chevron': L([[9, 5], [16, 12], [9, 19]]); ctx.stroke(); break;
  }
  ctx.restore();
}
// Standard pointer arrow, tip at (x, y), height s.
function arrow(x, y, s, fill = '#ffffff', stroke = '#0b0f14', lw = 2) {
  const p = [[0, 0], [0, 0.82], [0.215, 0.645], [0.355, 0.95], [0.48, 0.895], [0.345, 0.6], [0.6, 0.6]];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); p.forEach(([a, b], i) => (i ? ctx.lineTo(a, b) : ctx.moveTo(a, b))); ctx.closePath();
  ctx.lineJoin = 'round'; ctx.lineWidth = lw / s; ctx.strokeStyle = stroke; ctx.stroke(); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- statics
let logoImg, staticBg, noiseCv, stars;
function buildStatics() {
  staticBg = document.createElement('canvas'); staticBg.width = W; staticBg.height = H;
  const g = staticBg.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 18; y < H; y += 36) for (let x = 18; x < W; x += 36) { g.beginPath(); g.arc(x, y, 1.25, 0, 7); g.fill(); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 1.0);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

  // Static grain dithers the dark gradients so the H.264 encode does not band.
  noiseCv = document.createElement('canvas'); noiseCv.width = W; noiseCv.height = H;
  const n = noiseCv.getContext('2d'), id = n.createImageData(W, H), rnd = mulberry32(7);
  for (let i = 0; i < id.data.length; i += 4) { const v2 = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v2; id.data[i + 3] = 255; }
  n.putImageData(id, 0, 0);

  const r = mulberry32(42);
  stars = Array.from({ length: 170 }, () => ({ x: r(), y: r(), z: 0.25 + r() * 0.75, p: r() * 6.28, s: 0.6 + r() * 1.6 }));
}

// ---------------------------------------------------------------- layout keyframes
function logoRects(cx, cy, S) {
  const ox = cx - S / 2, oy = cy - S / 2;
  return { mon: { x: ox + 0.1316 * S, y: oy + 0.2033 * S, w: 0.6675 * S, h: 0.4729 * S }, ph: { x: ox + 0.614 * S, y: oy + 0.381 * S, w: 0.255 * S, h: 0.416 * S } };
}
const scaleRect = (r, cx, cy, s) => ({ x: cx + (r.x - cx) * s, y: cy + (r.y - cy) * s, w: r.w * s, h: r.h * s });
// Portrait stacks everything: caption, monitor, then the phone in front of the stand.
const HOOK = VERT ? { mon: { x: 325, y: 400, w: 430, h: 305 }, ph: { x: 465, y: 1160, w: 150, h: 245 } }
  : { mon: { x: 1160, y: 300, w: 430, h: 305 }, ph: { x: 395, y: 352, w: 150, h: 245 } };
const L1C = VERT ? [540, 830, 640] : [960, 410, 600];   // title logo: centre x, centre y, size
const L2C = VERT ? [540, 680, 560] : [960, 318, 470];   // end-card logo
const STC = VERT ? [540, 1000] : [960, 560];            // where the stage shrinks toward during the privacy beat
const LOGO1 = logoRects(L1C[0], L1C[1], L1C[2]);
const LOGO2 = logoRects(L2C[0], L2C[1], L2C[2]);
const STAGE = VERT ? { mon: { x: 40, y: 480, w: 1000, h: 1000 * 683 / 1180 }, ph: { x: 335, y: 1046, w: 410, h: 855 } }
  : { mon: { x: 174, y: 236, w: 1180, h: 683 }, ph: { x: 1336, y: 200, w: 410, h: 855 } };

function layout(t) {
  const T = TL;
  let mon, ph, monA = 1, phA = 1;
  const breathe = 1 + 0.03 * E.inOutSine(P(t, T.logoLand, T.zoomStart));
  const L1 = { mon: scaleRect(LOGO1.mon, L1C[0], L1C[1], breathe), ph: scaleRect(LOGO1.ph, L1C[0], L1C[1], breathe) };
  if (t < T.hookSnap + 0.2) {
    const a = E.outExpo(P(t, T.hookMonitorIn, T.hookMonitorIn + 0.8));
    const b = E.outBack(P(t, T.hookPhoneIn, T.hookPhoneIn + 0.55));
    mon = VERT ? { ...HOOK.mon, y: HOOK.mon.y - (1 - a) * 320 } : { ...HOOK.mon, x: HOOK.mon.x + (1 - a) * 320 };
    ph = VERT ? { ...HOOK.ph, y: HOOK.ph.y + (1 - b) * 320 } : { ...HOOK.ph, x: HOOK.ph.x - (1 - b) * 320 };
    monA = P(t, T.hookMonitorIn, T.hookMonitorIn + 0.3);
    phA = P(t, T.hookPhoneIn, T.hookPhoneIn + 0.25);
  } else if (t < T.logoLand) {
    const m = E.inOutCubic(P(t, T.hookSnap + 0.2, T.logoLand));
    mon = lerpRect(HOOK.mon, L1.mon, m); ph = lerpRect(HOOK.ph, L1.ph, m);
  } else if (t < T.zoomStart + 0.7 || t < 0) {
    const m = E.inOutCubic(P(t, T.zoomStart, T.zoomStart + 0.7));
    const punch = 1 + 0.05 * Math.sin(Math.PI * P(t, T.logoLand, T.logoLand + 0.25)) * (1 - P(t, T.logoLand, T.logoLand + 0.25));
    mon = lerpRect(scaleRect(L1.mon, L1C[0], L1C[1], punch), STAGE.mon, m); ph = lerpRect(scaleRect(L1.ph, L1C[0], L1C[1], punch), STAGE.ph, m);
  } else if (t < T.endStart) {
    const d = 1 - 0.04 * E.outCubic(P(t, T.trustIn, T.trustIn + 1.5));
    mon = scaleRect(STAGE.mon, STC[0], STC[1], d); ph = scaleRect(STAGE.ph, STC[0], STC[1], d);
  } else {
    const m = E.inOutCubic(P(t, T.endStart, T.endStart + 0.75));
    const st = { mon: scaleRect(STAGE.mon, STC[0], STC[1], 0.96), ph: scaleRect(STAGE.ph, STC[0], STC[1], 0.96) };
    const br = 1 + 0.025 * E.inOutSine(P(t, T.endStart + 0.75, T.duration));
    mon = lerpRect(st.mon, scaleRect(LOGO2.mon, L2C[0], L2C[1], br), m); ph = lerpRect(st.ph, scaleRect(LOGO2.ph, L2C[0], L2C[1], br), m);
  }
  const logo = Math.max(1 - E.inOutCubic(P(t, T.zoomStart + 0.1, T.zoomStart + 0.55)), E.inOutCubic(P(t, T.endStart + 0.05, T.endStart + 0.5)));
  return { mon, ph, monA, phA, logo };
}

// ---------------------------------------------------------------- monitor
function screenRect(r, lg) {
  const bez = lerp(22 * r.w / 1180, 0.0836 * r.w, lg);
  return { x: r.x + bez, y: r.y + bez, w: r.w - 2 * bez, h: r.h - 2 * bez };
}
function drawMonitor(r, lg, alpha, t) {
  ctx.save(); ctx.globalAlpha *= alpha;
  const rad = lerp(18 * r.w / 1180, 0.096 * r.w, lg), irad = lerp(8 * r.w / 1180, 0.024 * r.w, lg);
  const nW = lerp(0.075 * r.w, 0.106 * r.w, lg), nH = lerp(0.058 * r.h, 0.096 * r.h, lg), cx = r.x + r.w * lerp(0.5, 0.47, lg);
  const bW = lerp(0.3 * r.w, 0.42 * r.w, lg), bH = lerp(0.028 * r.h, 0.11 * r.h, lg);
  ctx.fillStyle = mix('#141a22', C.accent, lg); ctx.fillRect(cx - nW / 2, r.y + r.h - 4, nW, nH + 8);
  ctx.fillStyle = mix('#252e3a', C.accent, lg); rr(cx - bW / 2, r.y + r.h + nH, bW, bH, bH / 2); ctx.fill();
  // body, with a soft screen glow once it is a real monitor
  ctx.save();
  ctx.shadowColor = rgba(C.accent, 0.16 * (1 - lg)); ctx.shadowBlur = 90;
  ctx.fillStyle = mix('#202833', C.accent, lg); rr(r.x, r.y, r.w, r.h, rad); ctx.fill();
  ctx.restore();

    ctx.beginPath(); for (let i = 0; i <= 60 * d; i++) { const q = quad(p0, c, p1, i / 60); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); } ctx.stroke(); ctx.restore();
    const m = quad(p0, c, p1, 0.5);
    const la = P(t, T.hookLine + 0.3, T.hookLine + 0.6);
    if (VERT) txt('across the room', m[0] + 34, m[1] + 10, 30, { color: C.soft, alpha: la, w: 500 });
    else txt('across the room', m[0], m[1] - 30, 30, { color: C.soft, align: 'center', alpha: la, w: 500 });
  }
  ctx.restore();
  // the link snaps tight and pulls the two together
  const s = P(t, T.hookSnap - 0.05, T.hookSnap + 0.4);
  if (s > 0 && s < 1) {
    const ph = L.ph, mn = L.mon;
    const a0 = [ph.x + ph.w / 2, ph.y + ph.h / 2], a1 = [mn.x + mn.w / 2, mn.y + mn.h / 2];
    ctx.save(); ctx.strokeStyle = rgba(C.accent, 0.9 * (1 - s)); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.shadowColor = C.accent; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]); ctx.stroke(); ctx.restore();
  }
}
function drawTitle(t) {
  const T = TL, a = P(t, T.titleIn, T.titleIn + 0.5) * (1 - P(t, T.zoomStart - 0.15, T.zoomStart + 0.15));
  if (a <= 0) return;
  const p = E.outExpo(P(t, T.titleIn, T.titleIn + 0.8));
  const ty = VERT ? 1200 : 820, gy = VERT ? 1275 : 895;
  txt('PC Remote', CX, ty + (1 - p) * 30, 120, { w: 800, align: 'center', alpha: a, ls: lerp(24, -1, p) });
  ctx.save(); ctx.globalAlpha *= 1 - P(t, T.zoomStart - 0.15, T.zoomStart + 0.15);
  richRise([['Your computer.', '#c9d1da'], ['Controlled from your phone.', C.accent]], CX, gy, 40, 600, T.taglineIn, t, { stagger: 0.07 });
  ctx.restore();
  const r = P(t, T.logoLand, T.logoLand + 0.7);
  if (r > 0 && r < 1) { ctx.strokeStyle = rgba(C.accent, 0.7 * (1 - r)); ctx.lineWidth = 6 * (1 - r) + 1; circle(L1C[0], L1C[1], 160 + 520 * E.outCubic(r)); ctx.stroke(); }
}
const CAPS = () => [
  [TL.pairCaption, TL.touchpadCaption, 'PAIR', 'Approve the phone on your computer.', ['Approve the phone', 'on your computer.']],
  [TL.touchpadCaption, TL.keyboardCaption, 'TOUCHPAD', 'Glide, tap and scroll from the couch.', ['Glide, tap and scroll', 'from the couch.']],
  [TL.keyboardCaption, TL.mediaCaption, 'KEYBOARD', 'Type in any language, then send.', ['Type in any language,', 'then send.']],
  [TL.mediaCaption, TL.airCaption, 'MEDIA', 'Play, pause and set the volume.', ['Play, pause and', 'set the volume.']],
  [TL.airCaption, TL.trustIn, 'AIR POINTER', 'Turn your wrist. Point like a TV remote.', ['Turn your wrist.', 'Point like a TV remote.']],
];
function drawCaptions(t) {
  for (const [a, b, eye, head, lines] of CAPS()) {
    if (t < a - 0.01 || t > b + 0.01) continue;
    const out = P(t, b - 0.22, b);
    const pe = E.outCubic(P(t, a, a + 0.4));
    ctx.save(); ctx.globalAlpha *= 1 - out;
    if (VERT) {
      ctx.fillStyle = rgba(C.accent, pe); ctx.fillRect(70, 246, 36 * pe, 4);
      txt(eye, 120, 256, 24, { w: 700, color: C.accent, ls: 4, alpha: pe });
      lines.forEach((ln, i) => richRise([[ln, C.text]], 70, 338 + i * 74 - out * 10, 64, 800, a + 0.06 + i * 0.1, t, { align: 'left', stagger: 0.04 }));
    } else {
      ctx.fillStyle = rgba(C.accent, pe); ctx.fillRect(174, 96, 36 * pe, 4);
      txt(eye, 224, 106, 21, { w: 700, color: C.accent, ls: 4, alpha: pe });
      richRise([[head, C.text]], 174, 178 - out * 10, 56, 800, a + 0.06, t, { align: 'left', stagger: 0.04 });
    }
    ctx.restore();
  }
  // brand chip
  const ba = win(t, TL.pairCaption, TL.trustIn + 0.2, 0.4, 0.3);
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha *= ba;
    if (VERT) { const x0 = CX - (68 + measure('PC Remote', 30, 700)) / 2; ctx.drawImage(logoImg, x0, 110, 60, 60); txt('PC Remote', x0 + 68, 151, 30, { w: 700 }); }
    else { ctx.drawImage(logoImg, 1520, 100, 56, 56); txt('PC Remote', 1582, 138, 28, { w: 700 }); }
    ctx.restore();
  }
}
function drawTrust(t) {
  const T = TL, d = E.outCubic(P(t, T.trustIn, T.trustIn + 0.4)) * (1 - P(t, T.endStart, T.endStart + 0.35));
  if (d <= 0) return;
  ctx.fillStyle = `rgba(11,15,20,${0.84 * d})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha *= 1 - P(t, T.endStart - 0.1, T.endStart + 0.2);
  const pe = E.outCubic(P(t, T.trustIn + 0.1, T.trustIn + 0.5));
  if (VERT) {
    txt('PRIVATE BY DESIGN', CX, 600, 26, { w: 700, color: C.accent, ls: 6, align: 'center', alpha: pe });
    [[['Your phone.', C.text]], [['Your computer.', C.text]], [['No cloud in between.', C.accent]]]
      .forEach((segs, i) => richRise(segs, CX, 714 + i * 96, 84, 800, T.trustIn + 0.15 + i * 0.12, t, { stagger: 0.06 }));
  } else {
    txt('PRIVATE BY DESIGN', 960, 380, 24, { w: 700, color: C.accent, ls: 6, align: 'center', alpha: pe });
    richRise([['Your phone.', C.text], ['Your computer.', C.text], ['No cloud in between.', C.accent]], 960, 480, 72, 800, T.trustIn + 0.15, t, { stagger: 0.06 });
  }
  const chips = [['home', 'Stays on your network'], ['shield', 'Approved on your computer'], ['lock', 'Encrypted · no account']];
  const fs = 30, pad = 34, iw = 34, gap = 28;
  const widths = chips.map(([, s]) => pad * 2 + iw + 16 + measure(s, fs, 600));
  // landscape: one centred row; portrait: one chip per line
  let rowX = 960 - (widths.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  const pos = widths.map((w, i) => { if (VERT) return [CX - w / 2, 1010 + i * 112]; const q = [rowX, 610]; rowX += w + gap; return q; });
  chips.forEach(([ic, s], i) => {
    const p = E.outBack(P(t, T.chips[i], T.chips[i] + 0.4)), al = P(t, T.chips[i], T.chips[i] + 0.15);
    const x = pos[i][0], w = widths[i], cx = x + w / 2, cy = pos[i][1];
    ctx.save(); ctx.globalAlpha *= al; ctx.translate(cx, cy); ctx.scale(0.8 + 0.2 * p, 0.8 + 0.2 * p); ctx.translate(-cx, -cy);
    ctx.fillStyle = '#151c25'; rr(x, cy - 44, w, 88, 44); ctx.fill(); ctx.strokeStyle = rgba(C.accent, 0.5); ctx.lineWidth = 2; ctx.stroke();
    icon(ic, x + pad + iw / 2, cy, iw, C.accent, 2);
    txt(s, x + pad + iw + 16, cy + 11, fs, { w: 600 });
    ctx.restore();
  });
  ctx.restore();
}
function drawEnd(t) {
  const T = TL; if (t < T.endStart) return;
  const r = P(t, T.endLogo, T.endLogo + 0.9);
  const ey = VERT ? { title: 1000, tag: 1072, foot: 1152, url: 1300 } : { title: 640, tag: 712, foot: 790, url: 885 };
  if (r > 0 && r < 1) { ctx.strokeStyle = rgba(C.accent, 0.6 * (1 - r)); ctx.lineWidth = 5 * (1 - r) + 1; circle(L2C[0], L2C[1], 140 + 480 * E.outCubic(r)); ctx.stroke(); }
  const p = E.outExpo(P(t, T.endTitle, T.endTitle + 0.8));
  txt('PC Remote', CX, ey.title + (1 - p) * 28, 112, { w: 800, align: 'center', alpha: P(t, T.endTitle, T.endTitle + 0.35), ls: lerp(20, -1, p) });
  richRise([['Your computer.', '#c9d1da'], ['Controlled from your phone.', C.accent]], CX, ey.tag, 40, 600, T.endTagline, t, { stagger: 0.07 });
  const fa = E.outCubic(P(t, T.endFooter, T.endFooter + 0.4));
  const foot = VERT ? ['Free & open source  ·  Runs in your phone’s browser', 'Windows, plus macOS and Ubuntu previews']
    : ['Free & open source  ·  Windows, plus macOS and Ubuntu previews  ·  Runs in your phone’s browser'];
  foot.forEach((ln, i) => txt(ln, CX, ey.foot + i * 44 + (1 - fa) * 14, VERT ? 28 : 26, { color: C.muted, align: 'center', alpha: fa, w: 500 }));
  const ua = E.outBack(P(t, T.endUrl, T.endUrl + 0.45)), ual = P(t, T.endUrl, T.endUrl + 0.2);
  const url = 'github.com/maamouribilel/pc-remote', uw = measure(url, 32, 700) + 84;
  ctx.save(); ctx.globalAlpha *= ual; ctx.translate(CX, ey.url); ctx.scale(0.85 + 0.15 * ua, 0.85 + 0.15 * ua); ctx.translate(-CX, -ey.url);
  ctx.fillStyle = rgba(C.accent, 0.12); rr(CX - uw / 2, ey.url - 36, uw, 72, 36); ctx.fill();
  ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5; ctx.stroke();
  txt(url, CX, ey.url + 11, 32, { w: 700, color: C.accent, align: 'center' });
  ctx.restore();
}

// ---------------------------------------------------------------- frame
function renderAt(t) {
  ctx = mainCtx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  background(t);
  const L = layout(t);
  // devices on their own layer so the phone can knock a gap out of the monitor
  devCtx.setTransform(1, 0, 0, 1, 0, 0); devCtx.clearRect(0, 0, W, H);
  ctx = devCtx;
  drawMonitor(L.mon, L.logo, L.monA, t);
  let rot = 0, dy = 0;
  const T = TL, hold = P(t, T.airHold, T.airHold + 0.3) * (1 - P(t, T.airClick, T.airClick + 0.45));
  if (hold > 0) { const c = cursorAt(t); rot = clamp((c.x - 800) / 800, -1, 1) * 0.13 * hold; dy = clamp((c.y - 450) / 450, -1, 1) * 14 * hold; }
  drawPhone({ ...L.ph, y: L.ph.y + dy }, L.logo, L.phA, rot, 0.85, t);
  ctx = mainCtx;
  ctx.drawImage(devCv, 0, 0);
  // pointing beam from the phone to the cursor
  if (hold > 0.01 && t < T.fullscreen + 0.3) {
    const s = screenRect(L.mon, L.logo), c = cursorAt(t);
    const tx = s.x + c.x * s.w / 1600, ty = s.y + c.y * s.h / 900;
    const px = L.ph.x + L.ph.w / 2, py = L.ph.y + L.ph.h * 0.85 + dy;
    const top = [px + Math.sin(rot) * L.ph.h * 0.85, py - Math.cos(rot) * L.ph.h * 0.85];
    const g = ctx.createLinearGradient(top[0], top[1], tx, ty); g.addColorStop(0, rgba(C.accent, 0.0)); g.addColorStop(0.25, rgba(C.accent, 0.20 * hold)); g.addColorStop(1, rgba(C.accent, 0.04 * hold));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
    const ang = Math.atan2(ty - top[1], tx - top[0]), n = [Math.cos(ang + Math.PI / 2), Math.sin(ang + Math.PI / 2)];
    ctx.beginPath(); ctx.moveTo(top[0] + n[0] * 6, top[1] + n[1] * 6); ctx.lineTo(tx + n[0] * 44, ty + n[1] * 44); ctx.lineTo(tx - n[0] * 44, ty - n[1] * 44); ctx.lineTo(top[0] - n[0] * 6, top[1] - n[1] * 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  drawHook(t, L);
  drawTitle(t);
  drawCaptions(t);
  drawTrust(t);
  drawEnd(t);
  // grain + final fade from black at the very start
  ctx.save(); ctx.globalAlpha = 0.022; ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(noiseCv, 0, 0); ctx.restore();
  const fin = 1 - P(t, 0, 0.25); if (fin > 0) { ctx.fillStyle = `rgba(0,0,0,${fin})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  if (!TL) TL = window.TL = await (await fetch('timeline.json')).json();
  logoImg = new Image(); logoImg.src = '../../../src/remote/public/pc-remote-v2-128.png'; await logoImg.decode();
  await document.fonts.ready;
  buildStatics();
  renderAt(0);
  return true;
})();
window.renderAt = renderAt;
// Live preview when opened over http without the capture harness: loops in real time.
if (!window.__CAPTURE) window.ready.then(() => { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); }; loop(); });
</script>
